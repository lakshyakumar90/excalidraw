name: Deploy Backend to AWS EC2

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-aws-ec2
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy to EC2
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          require-lockfile: true

      - name: Run Neon database migrations (if DATABASE_URL secret is set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            pnpm --filter @repo/db exec prisma db migrate --db "$DATABASE_URL"
          else
            echo "DATABASE_URL secret not set; skipping migrations."
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build excalidraw-backend:ec2 image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: excalidraw-backend:ec2
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save compressed Docker image
        run: docker save excalidraw-backend:ec2 | gzip > backend.tar.gz

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          if [ -z "$EC2_SSH_KEY" ] || [ -z "$EC2_HOST" ]; then
            echo "Missing EC2_SSH_KEY or EC2_HOST repository secrets."
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Upload image and Compose config to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" "mkdir -p ~/excalidraw/deploy/ec2"
          scp -i ~/.ssh/deploy_key backend.tar.gz compose.ec2.yaml "${EC2_USER}@${EC2_HOST}:~/excalidraw/"
          scp -i ~/.ssh/deploy_key deploy/ec2/Caddyfile "${EC2_USER}@${EC2_HOST}:~/excalidraw/deploy/ec2/"

      - name: Load image and restart services on EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER || 'ubuntu' }}
        run: |
          ssh -i ~/.ssh/deploy_key "${EC2_USER}@${EC2_HOST}" '
            set -e
            cd ~/excalidraw
            sudo docker load -i backend.tar.gz
            rm -f backend.tar.gz
            sudo docker compose --env-file .env.ec2 -f compose.ec2.yaml up -d --wait --remove-orphans
            sudo docker image prune -f
            sudo docker compose --env-file .env.ec2 -f compose.ec2.yaml ps
          '
